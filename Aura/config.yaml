shodan:
  api_key: "YOUR_SHODAN_API_KEY"

ipinfo:
  token: "YOUR_IPINFO_TOKEN"

settings:
  timeout: 10
  http_retries: 2
  verify_tls: true
  phase0_workers: 6        # parallel workers for Phase 0 recon (1 = serial)
  user_agent: "Aura-Scanner/1.0 (National Security Audit)"

recon:
  google_dorks:
    - "site:{domain} inurl:admin"
    - "site:{domain} ext:env"
    - "site:{domain} intitle:index.of"
  crawler_max_pages: 25

scope:
  include_domains: []
  exclude_domains: []
  url_regex: ""
  # Cloud checks probe *guessed* bucket names on AWS/GCP/Azure, which may belong
  # to someone else. Set false if your engagement/program rules forbid that.
  allow_cloud_bucket_probes: true

# Two-account authorization testing (IDOR/BOLA). OFF by default. Only runs when
# enabled AND both accounts are set. GET-only, scope-checked, never mutates.
# Credentials are read here only and are never written to any report.
auth:
  enabled: false
  victim:
    headers: {}      # e.g. {Cookie: "session=<victim-cookie>"}
  attacker:
    headers: {}      # e.g. {Cookie: "session=<attacker-cookie>"} (low-priv probe)
  admin:
    headers: {}      # optional high-priv account; set it to enable vertical priv-esc checks
  endpoints: []        # optional extra authenticated-only paths, e.g. ["/api/me"]
  admin_endpoints: []  # optional admin-only paths, e.g. ["/admin", "/admin/users"]
  max_urls: 150

state:
  file: "reports/scan_state.json"
  resume: false

exports:
  formats: "json,csv,sarif"

quality:
  min_confidence: "medium"

scan:
  profile: "normal"

profiles:
  quick:
    crawler_max_pages: 10
    enable_crawler: false
    enable_toolchain_health: false
    enable_deep_scan: false
    enable_fuzzing: false
    enable_cve_scan: false
    nuclei_severity: "critical"
    ffuf_wordlist: "wordlists/common_quick.txt"
  normal:
    crawler_max_pages: 25
    enable_crawler: true
    enable_toolchain_health: true
    enable_deep_scan: true
    enable_fuzzing: true
    enable_cve_scan: true
    nuclei_severity: "high,critical"
    ffuf_wordlist: "wordlists/common.txt"
  deep:
    crawler_max_pages: 60
    enable_crawler: true
    enable_toolchain_health: true
    enable_deep_scan: true
    enable_fuzzing: true
    enable_cve_scan: true
    nuclei_severity: "medium,high,critical"
    ffuf_wordlist: "wordlists/common_deep.txt"

tuning:
  ignore_finding_patterns:
    - "manual review"
    - "possible issue detected"
  classic:
    include_manual_review: false
    smuggling_status_codes: [400, 411, 413, 500, 502]
  probes:
    max_urls: 3          # parameterised recon URLs handed to dalfox/sqlmap
  fuzz:
    max_seed_urls: 50
    max_params_per_url: 5

tools:
  ffuf_wordlist: "wordlists/common.txt"
  subjack_fingerprints: ""
  update_templates: false
  auto_maintenance: false
  payload_xss: "wordlists/payloads/xss.txt"
  payload_sqli: "wordlists/payloads/sqli.txt"
  payload_ssrf: "wordlists/payloads/ssrf.txt"
  payload_path: "wordlists/payloads/path.txt"
