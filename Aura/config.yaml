# Host intel uses Shodan InternetDB by default — free, NO API KEY needed
# (open ports / known CVEs / hostnames per IP). The key below is optional and only
# enables Shodan's paid search API; leave it as-is to run keyless.
shodan:
  api_key: "YOUR_SHODAN_API_KEY"

ipinfo:
  token: "YOUR_IPINFO_TOKEN"   # optional; without it, IP geo/ASN uses ip-api.com (keyless)

settings:
  timeout: 10
  http_retries: 2
  retry_backoff: 1.0       # exponential backoff factor; honours server Retry-After
  verify_tls: true
  phase0_workers: 3        # parallel workers for Phase 0 recon (1 = serial, quietest)
  naabu_ports: ""          # naabu scan range; "" = top 1000. e.g. "1-65535" (full) or "80,443,8080"
  phase1_workers: 3        # parallel Phase 1 tasks (probes, takeover, authz, ...)
  phase2_workers: 2        # parallel Phase 2 tasks (nuclei, CVE scan, ffuf/wapiti, fuzzing)
  http_workers: 8          # concurrent Python HTTP requests per module (paths, buckets, crawler, authz)
  tool_workers: 2          # concurrent sqlmap/dalfox processes (each keeps tool_rate_limit)
  # Speed vs. noise: each worker adds traffic. For the quietest scan set all of the
  # above to 1 (pacing via request_delay/jitter still applies across threads).
  # Low-noise defaults. A real browser UA (not "Aura-Scanner") avoids the obvious
  # WAF block; pacing + jitter space out the Python requests.
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36"
  request_delay: 0.0       # seconds between Python HTTP requests (global, 0 = off)
  request_jitter: 0.25     # add random 0..N seconds per request to desynchronise
  tool_rate_limit: 50      # req/s cap passed to nuclei/ffuf/sqlmap/dalfox (0 = tool default)
  proxy: ""                # e.g. http://127.0.0.1:8080 -> routes Python + external tools (Burp)

recon:
  google_dorks:
    - "site:{domain} inurl:admin"
    - "site:{domain} ext:env"
    - "site:{domain} intitle:index.of"
  crawler_max_pages: 25

scope:
  include_domains: []
  exclude_domains: []
  url_regex: ""
  # Cloud checks probe *guessed* bucket names on AWS/GCP/Azure, which may belong
  # to someone else. Set false if your engagement/program rules forbid that.
  allow_cloud_bucket_probes: false

# Two-account authorization testing (IDOR/BOLA). OFF by default. Only runs when
# enabled AND both accounts are set. GET-only, scope-checked, never mutates.
# Credentials are read here only and are never written to any report.
auth:
  enabled: false
  victim:
    headers: {}      # e.g. {Cookie: "session=<victim-cookie>"}
  attacker:
    headers: {}      # e.g. {Cookie: "session=<attacker-cookie>"} (low-priv probe)
  admin:
    headers: {}      # optional high-priv account; set it to enable vertical priv-esc checks
  endpoints: []        # optional extra authenticated-only paths, e.g. ["/api/me"]
  admin_endpoints: []  # optional admin-only paths, e.g. ["/admin", "/admin/users"]
  max_urls: 150
  id_enumeration: true     # harvest the owner's real ids and substitute them into
                           # numeric path segments (/orders/1 -> /orders/<owned id>)
  id_neighbor_window: 1    # also try id ±N of a path's existing numeric segment (sequential IDOR)

state:
  file: "reports/scan_state.json"
  resume: false

exports:
  formats: "json,csv,sarif"
  pdf: false               # true = always write the PDF report (or pass --pdf / -o)

quality:
  min_confidence: "medium"

scan:
  profile: "normal"

profiles:
  quick:
    crawler_max_pages: 10
    enable_crawler: false
    enable_toolchain_health: false
    enable_deep_scan: false
    enable_fuzzing: false
    enable_cve_scan: false
    nuclei_severity: "critical"
    ffuf_wordlist: "wordlists/common_quick.txt"
  normal:
    crawler_max_pages: 25
    enable_crawler: true
    enable_toolchain_health: true
    enable_deep_scan: true
    enable_fuzzing: true
    enable_cve_scan: true
    nuclei_severity: "high,critical"
    ffuf_wordlist: "wordlists/common.txt"
  deep:
    crawler_max_pages: 60
    enable_crawler: true
    enable_toolchain_health: true
    enable_deep_scan: true
    enable_fuzzing: true
    enable_cve_scan: true
    nuclei_severity: "medium,high,critical"
    ffuf_wordlist: "wordlists/common_deep.txt"

tuning:
  ignore_finding_patterns:
    - "manual review"
    - "possible issue detected"
  classic:
    include_manual_review: false
    smuggling_status_codes: [400, 411, 413, 500, 502]
  probes:
    max_urls: 3          # parameterised recon URLs handed to dalfox/sqlmap
  fuzz:
    max_seed_urls: 50
    max_params_per_url: 5

tools:
  ffuf_wordlist: "wordlists/common.txt"
  subjack_fingerprints: ""
  update_templates: false
  auto_maintenance: false
  payload_xss: "wordlists/payloads/xss.txt"
  payload_sqli: "wordlists/payloads/sqli.txt"
  payload_ssrf: "wordlists/payloads/ssrf.txt"
  payload_path: "wordlists/payloads/path.txt"
